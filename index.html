<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LS25 Auftragsmanager</title>
  
  <!-- Tailwind CSS & React über CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Deine Google Apps Script Web-App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbxnH6FkDM1VV6Aa1g5n5qS5-uvonbnxC131TnQIgjdtblV6D_61OjF-eDLo0PfheVpE/exec";

    // Grundpreise pro Hektar
    const BASE_RATES = {
      'Pflügen': 450,
      'Grubbern / Tiefenlockerer': 250,
      'Dreschen / Ernten': 400,
      'Säen / Anpflanzen': 250,
      'Ballen pressen': 200,
      'Pflanzenschutz / Spritzen': 150,
      'Düngen': 120,
      'Kalken': 150,
      'Logistik & Transport': 0,
      'Maschinenverleih': 0,
      'Sonstiges': 0
    };

    // Hilfsfunktion zum Runden auf 100 €
    const roundTo100 = (amount) => {
      if (!amount || isNaN(amount)) return 0;
      return Math.round(amount / 100) * 100;
    };

    function App() {
      // Profil / Hofname
      const [userName, setUserName] = useState(() => localStorage.getItem('ls25_username') || 'Hof 1');
      const [isEditingProfile, setIsEditingProfile] = useState(false);
      const [tempUserName, setTempUserName] = useState(userName);

      // App State
      const [activeTab, setActiveTab] = useState('marketplace'); // 'marketplace' | 'active' | 'finance'
      const [contracts, setContracts] = useState([]);
      const [loading, setLoading] = useState(false);
      const [lastSync, setLastSync] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);

      // Formular State
      const [formData, setFormData] = useState({
        feld: 'Feld 1',
        taetigkeit: 'Pflügen',
        hektar: '2.5',
        duengerOption: 'hof_eigen',
        manuellerPreis: '',
        beschreibung: ''
      });

      // Daten von Google Sheets laden
      const fetchContracts = async () => {
        setLoading(true);
        try {
          const response = await fetch(API_URL);
          if (response.ok) {
            const data = await response.json();
            setContracts(Array.isArray(data) ? data : []);
            setLastSync(new Date());
          }
        } catch (err) {
          console.error("Fehler beim Laden der Aufträge:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchContracts();
        const interval = setInterval(fetchContracts, 10000); // Alle 10 Sek. synchronisieren
        return () => clearInterval(interval);
      }, []);

      // Profil speichern
      const handleSaveProfile = () => {
        if (tempUserName.trim()) {
          setUserName(tempUserName.trim());
          localStorage.setItem('ls25_username', tempUserName.trim());
          setIsEditingProfile(false);
        }
      };

      // Preisberechnung mit 100€ Rundung
      const calculatePrice = () => {
        if (formData.manuellerPreis !== '') {
          return roundTo100(parseFloat(formData.manuellerPreis));
        }
        if (formData.taetigkeit === 'Logistik & Transport' || formData.taetigkeit === 'Maschinenverleih' || formData.taetigkeit === 'Sonstiges') {
          return 0;
        }

        const ha = parseFloat(formData.hektar) || 0;
        let baseRate = BASE_RATES[formData.taetigkeit] || 0;

        if (formData.duengerOption === 'lohner_material') {
          if (formData.taetigkeit === 'Düngen') baseRate += 100;
          if (formData.taetigkeit === 'Kalken') baseRate += 100;
        }

        return roundTo100(ha * baseRate);
      };

      // Neuer Auftrag absenden
      const handleCreateContract = async (e) => {
        e.preventDefault();
        const finalPrice = calculatePrice();

        const newContractData = {
          id: "ORDER-" + Date.now(),
          feld: formData.feld,
          taetigkeit: formData.taetigkeit,
          hektar: (formData.taetigkeit.includes('Logistik') || formData.taetigkeit.includes('Maschinen')) ? 0 : (parseFloat(formData.hektar) || 0),
          preis: finalPrice,
          duengerOption: (formData.taetigkeit === 'Düngen' || formData.taetigkeit === 'Kalken') ? formData.duengerOption : '-',
          ersteller: userName,
          beschreibung: formData.beschreibung
        };

        setLoading(true);
        try {
          await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'create', data: newContractData })
          });
          setIsModalOpen(false);
          setFormData({
            feld: 'Feld 1',
            taetigkeit: 'Pflügen',
            hektar: '2.5',
            duengerOption: 'hof_eigen',
            manuellerPreis: '',
            beschreibung: ''
          });
          await fetchContracts();
        } catch (err) {
          console.error("Fehler beim Erstellen:", err);
        } finally {
          setLoading(false);
        }
      };

      // Status-Änderung (Annehmen, Erledigt, Bezahlt)
      const handleUpdateStatus = async (id, newStatus, contractorName = null) => {
        setLoading(true);
        try {
          const updatePayload = { id, status: newStatus };
          if (contractorName !== null) updatePayload.auftragnehmer = contractorName;

          await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'updateStatus', data: updatePayload })
          });
          await fetchContracts();
        } catch (err) {
          console.error("Fehler beim Aktualisieren:", err);
        } finally {
          setLoading(false);
        }
      };

      // Auftrag löschen
      const handleDeleteContract = async (id) => {
        if (!window.confirm("Möchtest du diesen Auftrag wirklich löschen?")) return;
        setLoading(true);
        try {
          await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'delete', data: { id } })
          });
          await fetchContracts();
        } catch (err) {
          console.error("Fehler beim Löschen:", err);
        } finally {
          setLoading(false);
        }
      };

      // Filter-Listen
      const openContracts = contracts.filter(c => c.status === 'offen' && c.ersteller !== userName);
      const myCreatedContracts = contracts.filter(c => c.ersteller === userName);
      const myAcceptedContracts = contracts.filter(c => c.auftragnehmer === userName && (c.status === 'in_bearbeitung' || c.status === 'erledigt'));

      // Finanzen
      const completedAsContractor = contracts.filter(c => c.auftragnehmer === userName && c.status === 'bezahlt');
      const completedAsOwner = contracts.filter(c => c.ersteller === userName && c.status === 'bezahlt');

      const totalEarnings = completedAsContractor.reduce((acc, c) => acc + (parseFloat(c.preis) || 0), 0);
      const totalExpenses = completedAsOwner.reduce((acc, c) => acc + (parseFloat(c.preis) || 0), 0);
      const netBalance = totalEarnings - totalExpenses;

      return (
        <div className="flex flex-col min-h-screen">
          
          {/* HEADER */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 px-4 py-3">
            <div className="max-w-6xl mx-auto flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-emerald-500/10 p-2 rounded-xl border border-emerald-500/20 text-emerald-400 font-bold">
                  🚜
                </div>
                <div>
                  <h1 className="font-bold text-lg text-slate-100 leading-tight">LS25 Manager</h1>
                  <p className="text-xs text-slate-400 flex items-center gap-1">
                    <span className={`w-2 h-2 rounded-full ${loading ? 'bg-amber-400 animate-pulse' : 'bg-emerald-400'}`}></span>
                    {loading ? 'Synchronisiere...' : lastSync ? `Live synced (${lastSync.toLocaleTimeString()})` : 'Aktiv'}
                  </p>
                </div>
              </div>

              {/* Mittiger Create-Button */}
              <button 
                onClick={() => setIsModalOpen(true)}
                className="hidden sm:flex items-center space-x-2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-xl shadow-lg transition active:scale-95"
              >
                <span>+ Auftrag erstellen</span>
              </button>

              {/* Profil Button */}
              <button 
                onClick={() => { setTempUserName(userName); setIsEditingProfile(true); }}
                className="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-xl border border-slate-700 transition"
              >
                <span className="text-emerald-400">👤</span>
                <span className="font-medium text-sm text-slate-200">{userName}</span>
              </button>
            </div>
          </header>

          {/* MOBILE BUTTON */}
          <div className="sm:hidden fixed bottom-6 right-4 z-40">
            <button 
              onClick={() => setIsModalOpen(true)}
              className="bg-emerald-600 hover:bg-emerald-500 text-white p-4 rounded-full shadow-2xl font-bold text-xl"
            >
              +
            </button>
          </div>

          {/* REITER TABS */}
          <nav className="bg-slate-900/60 border-b border-slate-800 px-4">
            <div className="max-w-6xl mx-auto flex space-x-2">
              <button
                onClick={() => setActiveTab('marketplace')}
                className={`py-3 px-4 font-medium text-sm border-b-2 transition ${
                  activeTab === 'marketplace' ? 'border-emerald-500 text-emerald-400 bg-emerald-500/5' : 'border-transparent text-slate-400'
                }`}
              >
                Marktplatz & Eigene ({openContracts.length})
              </button>

              <button
                onClick={() => setActiveTab('active')}
                className={`py-3 px-4 font-medium text-sm border-b-2 transition ${
                  activeTab === 'active' ? 'border-emerald-500 text-emerald-400 bg-emerald-500/5' : 'border-transparent text-slate-400'
                }`}
              >
                Meine aktiven Aufträge ({myAcceptedContracts.length})
              </button>

              <button
                onClick={() => setActiveTab('finance')}
                className={`py-3 px-4 font-medium text-sm border-b-2 transition ${
                  activeTab === 'finance' ? 'border-emerald-500 text-emerald-400 bg-emerald-500/5' : 'border-transparent text-slate-400'
                }`}
              >
                Statistiken & Finanzen
              </button>
            </div>
          </nav>

          {/* INHALT */}
          <main className="flex-grow max-w-6xl w-full mx-auto px-4 py-6">

            {/* TAB 1: MARKTPLATZ */}
            {activeTab === 'marketplace' && (
              <div className="space-y-8">
                
                <section>
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="text-lg font-bold">Offene Server-Aufträge</h2>
                    <button onClick={fetchContracts} className="text-xs bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-slate-300">
                      🔄 Aktualisieren
                    </button>
                  </div>

                  {openContracts.length === 0 ? (
                    <div className="bg-slate-900/50 border border-slate-800 rounded-2xl p-8 text-center text-slate-400 text-sm">
                      Aktuell keine freien Aufträge vorhanden.
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {openContracts.map((c) => (
                        <div key={c.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between space-y-4">
                          <div>
                            <div className="flex justify-between items-start">
                              <div>
                                <span className="text-xs font-semibold px-2.5 py-1 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                  {c.feld}
                                </span>
                                <h3 className="font-bold text-lg mt-2">{c.taetigkeit}</h3>
                              </div>
                              <span className="text-xl font-black text-emerald-400">{c.preis} €</span>
                            </div>

                            <div className="text-xs text-slate-400 space-y-1 mt-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
                              {c.hektar > 0 && <p><strong>Fläche:</strong> {c.hektar} ha</p>}
                              {c.duengerOption !== '-' && c.duengerOption !== '' && (
                                <p><strong>Material:</strong> {c.duengerOption === 'lohner_material' ? 'Lohner bringt Dünger/Kalk mit (+100€/ha)' : 'Hof-eigener Dünger/Kalk'}</p>
                              )}
                              <p><strong>Auftraggeber:</strong> {c.ersteller}</p>
                              {c.beschreibung && <p className="italic text-slate-400 mt-1">"{c.beschreibung}"</p>}
                            </div>
                          </div>

                          <button
                            onClick={() => handleUpdateStatus(c.id, 'in_bearbeitung', userName)}
                            className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-xl transition"
                          >
                            Auftrag annehmen
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </section>

                <section className="pt-4 border-t border-slate-800">
                  <h2 className="text-lg font-bold mb-4">Von mir erstellte Aufträge ({myCreatedContracts.length})</h2>
                  {myCreatedContracts.length === 0 ? (
                    <div className="bg-slate-900/30 border border-slate-800 rounded-2xl p-6 text-center text-slate-500 text-sm">
                      Du hast noch keine eigenen Aufträge ausgeschrieben.
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {myCreatedContracts.map((c) => (
                        <div key={c.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="text-xs font-semibold px-2 py-0.5 rounded bg-slate-800">{c.feld}</span>
                              <span className="font-bold">{c.taetigkeit}</span>
                              <span className="text-xs text-slate-400">({c.hektar} ha)</span>
                            </div>
                            <div className="text-xs text-slate-400 flex items-center gap-3 mt-1">
                              <span>Preis: <strong className="text-emerald-400">{c.preis} €</strong></span>
                              <span>Bearbeiter: <strong className="text-slate-200">{c.auftragnehmer || 'Niemand'}</strong></span>
                            </div>
                          </div>

                          <div className="flex items-center gap-2">
                            <span className="text-xs px-3 py-1 rounded-full font-medium bg-slate-800 text-slate-300">
                              {c.status === 'offen' && 'Wartet auf Helfer'}
                              {c.status === 'in_bearbeitung' && 'Wird bearbeitet'}
                              {c.status === 'erledigt' && 'Erledigt (Auszahlung offen)'}
                              {c.status === 'bezahlt' && 'Bezahlt'}
                            </span>

                            {c.status === 'erledigt' && (
                              <button
                                onClick={() => handleUpdateStatus(c.id, 'bezahlt')}
                                className="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg"
                              >
                                Bezahlt markieren
                              </button>
                            )}

                            <button
                              onClick={() => handleDeleteContract(c.id)}
                              className="text-slate-500 hover:text-red-400 p-1.5"
                              title="Auftrag löschen"
                            >
                              🗑️
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </section>

              </div>
            )}

            {/* TAB 2: AKTIVE AUFTRÄGE */}
            {activeTab === 'active' && (
              <div className="space-y-4">
                <h2 className="text-lg font-bold mb-2">Angenommene Aufträge</h2>
                {myAcceptedContracts.length === 0 ? (
                  <div className="bg-slate-900/50 border border-slate-800 rounded-2xl p-8 text-center text-slate-400 text-sm">
                    Du hast aktuell keine aktiven Aufträge.
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {myAcceptedContracts.map((c) => (
                      <div key={c.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                        <div className="flex justify-between items-start">
                          <div>
                            <span className="text-xs font-semibold px-2.5 py-1 rounded bg-slate-800 text-emerald-400">{c.feld}</span>
                            <h3 className="font-bold text-lg mt-2">{c.taetigkeit}</h3>
                          </div>
                          <span className="text-xl font-black text-emerald-400">{c.preis} €</span>
                        </div>

                        {c.status === 'in_bearbeitung' ? (
                          <button
                            onClick={() => handleUpdateStatus(c.id, 'erledigt')}
                            className="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl transition"
                          >
                            Als erledigt markieren
                          </button>
                        ) : (
                          <div className="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs text-center py-2 rounded-xl">
                            Erledigt! Wartet auf Auszahlung vom Hof.
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: FINANZEN */}
            {activeTab === 'finance' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                    <span className="text-xs uppercase text-slate-400">Einnahmen</span>
                    <div className="text-2xl font-black text-emerald-400 mt-1">+{totalEarnings} €</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                    <span className="text-xs uppercase text-slate-400">Ausgaben</span>
                    <div className="text-2xl font-black text-red-400 mt-1">-{totalExpenses} €</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                    <span className="text-xs uppercase text-slate-400">Netto-Differenz</span>
                    <div className={`text-2xl font-black mt-1 ${netBalance >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                      {netBalance >= 0 ? `+${netBalance}` : netBalance} €
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* OVERLAY MODAL: NEUER AUFTRAG */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-lg">Neuen Auftrag erstellen</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 font-bold">✕</button>
                </div>

                <form onSubmit={handleCreateContract} className="space-y-4">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Feld auswählen</label>
                    <select
                      value={formData.feld}
                      onChange={(e) => setFormData({ ...formData, feld: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm"
                    >
                      <option value="Kein Feld / Logistik">Kein Feld / Logistik</option>
                      {Array.from({ length: 50 }, (_, i) => (
                        <option key={i + 1} value={`Feld ${i + 1}`}>Feld {i + 1}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Tätigkeit</label>
                    <select
                      value={formData.taetigkeit}
                      onChange={(e) => setFormData({ ...formData, taetigkeit: e.target.value, manuellerPreis: '' })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm"
                    >
                      {Object.keys(BASE_RATES).map((rate) => (
                        <option key={rate} value={rate}>
                          {rate} {BASE_RATES[rate] > 0 ? `(${BASE_RATES[rate]} €/ha)` : ''}
                        </option>
                      ))}
                    </select>
                  </div>

                  {formData.taetigkeit !== 'Logistik & Transport' && formData.taetigkeit !== 'Maschinenverleih' && formData.taetigkeit !== 'Sonstiges' && (
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Fläche (ha)</label>
                      <input
                        type="number"
                        step="0.1"
                        value={formData.hektar}
                        onChange={(e) => setFormData({ ...formData, hektar: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm"
                      />
                    </div>
                  )}

                  {(formData.taetigkeit === 'Düngen' || formData.taetigkeit === 'Kalken') && (
                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-2">
                      <label className="font-bold text-slate-300">Material-Herkunft</label>
                      <div>
                        <label className="flex items-center gap-2">
                          <input
                            type="radio"
                            name="duenger"
                            value="hof_eigen"
                            checked={formData.duengerOption === 'hof_eigen'}
                            onChange={(e) => setFormData({ ...formData, duengerOption: e.target.value })}
                          />
                          <span>Hof-eigener Dünger/Kalk</span>
                        </label>
                        <label className="flex items-center gap-2 mt-1">
                          <input
                            type="radio"
                            name="duenger"
                            value="lohner_material"
                            checked={formData.duengerOption === 'lohner_material'}
                            onChange={(e) => setFormData({ ...formData, duengerOption: e.target.value })}
                          />
                          <span>Lohner bringt Material mit (+100 €/ha)</span>
                        </label>
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Preis (€) - Optional überschreiben</label>
                    <input
                      type="number"
                      placeholder={calculatePrice() + " € (Automatisch)"}
                      value={formData.manuellerPreis}
                      onChange={(e) => setFormData({ ...formData, manuellerPreis: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm"
                    />
                  </div>

                  <div className="bg-emerald-500/10 border border-emerald-500/20 p-3 rounded-xl flex justify-between items-center text-xs">
                    <span>Finaler Preis (100er gerundet):</span>
                    <span className="text-lg font-black text-emerald-400">{calculatePrice()} €</span>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition"
                  >
                    Auftrag veröffentlichen
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* PROFIL MODAL */}
          {isEditingProfile && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 space-y-4">
                <h3 className="font-bold text-lg">Hofname ändern</h3>
                <input
                  type="text"
                  value={tempUserName}
                  onChange={(e) => setTempUserName(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm"
                />
                <div className="flex gap-2">
                  <button onClick={() => setIsEditingProfile(false)} className="w-1/2 bg-slate-800 p-2 rounded-xl text-xs">Abbrechen</button>
                  <button onClick={handleSaveProfile} className="w-1/2 bg-emerald-600 p-2 rounded-xl text-xs text-white">Speichern</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
